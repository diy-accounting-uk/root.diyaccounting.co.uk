name: deploy holding
run-name: "deploy holding from ${{ github.ref_name }}"
# SPDX-FileCopyrightText: 2025 DIY Accounting Limited
# SPDX-License-Identifier: AGPL-3.0-or-later

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: "Where to point the apex and gateway domains"
        required: true
        options:
          - "holding"
          - "restore"
        default: "holding"
      environment-name:
        type: choice
        description: "Environment name (auto = derive from branch)"
        required: false
        options:
          - "(auto)"
          - "ci"
          - "prod"
        default: "(auto)"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"

jobs:
  params:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: "github.event_name=[${{ github.event_name }}]"
        run: ":"
      - name: "github.ref=[${{ github.ref }}]"
        run: ":"
      - name: "inputs.target=[${{ inputs.target }}]"
        run: ":"
      - name: "inputs.environment-name=[${{ inputs.environment-name }}]"
        run: ":"
      - name: Normalise Params
        id: normalise
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        run: |
          set -euo pipefail
          TARGET="${INPUT_TARGET:-holding}"

          ENV_NAME="${INPUT_ENVIRONMENT_NAME}"
          if [ "$ENV_NAME" = "(auto)" ] || [ -z "$ENV_NAME" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then ENV_NAME="prod"; else ENV_NAME="ci"; fi
          fi

          # These live domains must stay equal to the holding certificate's subject alternative
          # names, which RootEnvironment.apexFailoverDomainNames builds. CloudFront rejects an
          # alias the distribution's certificate does not cover.
          if [ "$ENV_NAME" = "prod" ]; then
            HOLDING_DOMAIN="holding.diyaccounting.co.uk"
            LIVE_DOMAINS="diyaccounting.co.uk www.diyaccounting.co.uk prod-gateway.diyaccounting.co.uk"
          else
            HOLDING_DOMAIN="${ENV_NAME}-holding.diyaccounting.co.uk"
            LIVE_DOMAINS="${ENV_NAME}-gateway.diyaccounting.co.uk"
          fi

          echo "target=${TARGET}" | tee -a "$GITHUB_OUTPUT"
          echo "environment-name=${ENV_NAME}" | tee -a "$GITHUB_OUTPUT"
          echo "holding-domain=${HOLDING_DOMAIN}" | tee -a "$GITHUB_OUTPUT"
          echo "live-domains=${LIVE_DOMAINS}" | tee -a "$GITHUB_OUTPUT"
    outputs:
      target: ${{ steps.normalise.outputs.target }}
      environment-name: ${{ steps.normalise.outputs.environment-name }}
      holding-domain: ${{ steps.normalise.outputs.holding-domain }}
      live-domains: ${{ steps.normalise.outputs.live-domains }}

  move-aliases:
    name: "point the gateway domains at ${{ needs.params.outputs.target }}"
    needs:
      - params
    runs-on: ubuntu-24.04
    environment: ${{ needs.params.outputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    env:
      TARGET: ${{ needs.params.outputs.target }}
      ENVIRONMENT_NAME: ${{ needs.params.outputs.environment-name }}
      HOLDING_DOMAIN: ${{ needs.params.outputs.holding-domain }}
      LIVE_DOMAINS: ${{ needs.params.outputs.live-domains }}
      HOSTED_ZONE_ID: ${{ vars.ROOT_HOSTED_ZONE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # === Gateway account: the live distribution ===

      - name: Configure gateway account (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.GATEWAY_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume gateway deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.GATEWAY_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Resolve the live gateway distribution
        id: gateway
        shell: bash
        run: |
          set -euo pipefail
          STACK_NAME="${ENVIRONMENT_NAME}-gateway-GatewayStack"
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' \
            --output text)
          DISTRIBUTION_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionDomainName`].OutputValue' \
            --output text)
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "ERROR: no DistributionId output on stack ${STACK_NAME}" >&2
            exit 1
          fi
          if [ -z "$DISTRIBUTION_DOMAIN" ] || [ "$DISTRIBUTION_DOMAIN" = "None" ]; then
            echo "ERROR: no DistributionDomainName output on stack ${STACK_NAME}" >&2
            exit 1
          fi
          echo "distribution-id=${DISTRIBUTION_ID}" | tee -a "$GITHUB_OUTPUT"
          echo "distribution-domain=${DISTRIBUTION_DOMAIN}" | tee -a "$GITHUB_OUTPUT"

      - name: Release the live aliases from the gateway distribution
        if: ${{ needs.params.outputs.target == 'holding' }}
        shell: bash
        run: ./scripts/cloudfront-aliases.sh remove "$GATEWAY_DISTRIBUTION_ID" $LIVE_DOMAINS
        env:
          GATEWAY_DISTRIBUTION_ID: ${{ steps.gateway.outputs.distribution-id }}

      # === Management account: the holding distribution and the hosted zone ===

      - name: Configure root account (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ROOT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume root deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ROOT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Resolve the holding distribution
        id: holding
        shell: bash
        run: |
          set -euo pipefail
          echo "Looking up the CloudFront distribution tagged OriginFor=${HOLDING_DOMAIN}"
          DISTRIBUTION_ARN=$(aws resourcegroupstaggingapi get-resources \
            --resource-type-filters cloudfront:distribution \
            --region us-east-1 \
            --tag-filters Key=OriginFor,Values="${HOLDING_DOMAIN}" \
            --query 'ResourceTagMappingList[0].ResourceARN' \
            --output text)
          if [ -z "$DISTRIBUTION_ARN" ] || [ "$DISTRIBUTION_ARN" = "None" ]; then
            echo "ERROR: no CloudFront distribution tagged OriginFor=${HOLDING_DOMAIN}" >&2
            exit 1
          fi
          echo "distribution-id=${DISTRIBUTION_ARN##*/}" | tee -a "$GITHUB_OUTPUT"

      - name: Claim the live aliases for the holding distribution
        if: ${{ needs.params.outputs.target == 'holding' }}
        shell: bash
        run: ./scripts/cloudfront-aliases.sh add "$HOLDING_DISTRIBUTION_ID" $LIVE_DOMAINS
        env:
          HOLDING_DISTRIBUTION_ID: ${{ steps.holding.outputs.distribution-id }}

      - name: Release the live aliases from the holding distribution
        if: ${{ needs.params.outputs.target == 'restore' }}
        shell: bash
        run: ./scripts/cloudfront-aliases.sh remove "$HOLDING_DISTRIBUTION_ID" $LIVE_DOMAINS
        env:
          HOLDING_DISTRIBUTION_ID: ${{ steps.holding.outputs.distribution-id }}

      # === Gateway account again: hand the aliases back ===

      - name: Configure gateway account for the handback (OIDC)
        if: ${{ needs.params.outputs.target == 'restore' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.GATEWAY_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume gateway deployment role for the handback
        if: ${{ needs.params.outputs.target == 'restore' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.GATEWAY_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Return the live aliases to the gateway distribution
        if: ${{ needs.params.outputs.target == 'restore' }}
        shell: bash
        run: ./scripts/cloudfront-aliases.sh add "$GATEWAY_DISTRIBUTION_ID" $LIVE_DOMAINS
        env:
          GATEWAY_DISTRIBUTION_ID: ${{ steps.gateway.outputs.distribution-id }}

      # === Management account again: repoint the records ===

      - name: Configure root account for Route53 (OIDC)
        if: ${{ needs.params.outputs.target == 'restore' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ROOT_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: false
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Assume root deployment role for Route53
        if: ${{ needs.params.outputs.target == 'restore' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ROOT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          audience: sts.amazonaws.com
          role-skip-session-tagging: true
          output-credentials: true
          retry-max-attempts: 3

      - name: Point the live domains at the chosen distribution
        shell: bash
        env:
          GATEWAY_DISTRIBUTION_DOMAIN: ${{ steps.gateway.outputs.distribution-domain }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "holding" ]; then
            # Aliasing to another record in the same zone uses that zone's own id.
            ALIAS_TARGET="${HOLDING_DOMAIN}"
            ALIAS_ZONE_ID="${HOSTED_ZONE_ID}"
          else
            # Aliasing straight to a distribution uses CloudFront's fixed alias zone id.
            ALIAS_TARGET="${GATEWAY_DISTRIBUTION_DOMAIN}"
            ALIAS_ZONE_ID="Z2FDTNDATAQYW2"
          fi

          CHANGES=$(printf '%s\n' $LIVE_DOMAINS | jq -R . | jq -s \
            --arg target "$ALIAS_TARGET" --arg zone "$ALIAS_ZONE_ID" '
              [ .[] as $name | ["A", "AAAA"][] as $type | {
                  Action: "UPSERT",
                  ResourceRecordSet: {
                    Name: ($name + "."),
                    Type: $type,
                    AliasTarget: {
                      HostedZoneId: $zone,
                      DNSName: ($target + "."),
                      EvaluateTargetHealth: false
                    }
                  }
                } ]')

          echo "Upserting ${LIVE_DOMAINS} to alias ${ALIAS_TARGET} in zone ${HOSTED_ZONE_ID}"
          aws route53 change-resource-record-sets \
            --hosted-zone-id "${HOSTED_ZONE_ID}" \
            --change-batch "$(jq -n --argjson changes "$CHANGES" \
              '{Comment: "Point the live gateway domains at the failover target", Changes: $changes}')"

      - name: Summary
        shell: bash
        env:
          GATEWAY_DISTRIBUTION_ID: ${{ steps.gateway.outputs.distribution-id }}
          HOLDING_DISTRIBUTION_ID: ${{ steps.holding.outputs.distribution-id }}
        run: |
          {
            echo "## Deploy holding result"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Target | \`${TARGET}\` |"
            echo "| Environment | \`${ENVIRONMENT_NAME}\` |"
            echo "| Live domains | \`${LIVE_DOMAINS}\` |"
            echo "| Holding domain | \`${HOLDING_DOMAIN}\` |"
            echo "| Gateway distribution | \`${GATEWAY_DISTRIBUTION_ID}\` |"
            echo "| Holding distribution | \`${HOLDING_DISTRIBUTION_ID}\` |"
          } >>"$GITHUB_STEP_SUMMARY"
